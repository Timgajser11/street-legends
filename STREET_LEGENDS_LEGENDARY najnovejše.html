<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050018;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#threeView{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:none;pointer-events:none}
#game{z-index:1}
#logoScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #151044 0%,
            #080020 45%,
            #020006 100%
        );
}

#logo{
    width:min(720px,85vw);
    max-height:420px;
    object-fit:contain;

    filter:
        drop-shadow(0 0 12px #19e8ff)
        drop-shadow(0 0 35px #00bfff55);

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }
    50%{
        transform:translateY(-9px) scale(1.015);
    }
}

#teamText{
    margin-top:15px;
    color:#6cf6ff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 15px #00eaff;
}

#start{
    margin-top:32px;
    padding:15px 65px;

    color:#05000d;
    background:
        linear-gradient(
            135deg,
            #3affff,
            #477aff
        );

    border:0;
    border-radius:8px;

    font-size:19px;
    font-weight:1000;
    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 15px #00eaff,
        0 0 50px #005cff66;

    transition:.2s;
}

#start:hover{
    transform:scale(1.08);
    box-shadow:
        0 0 25px #00eaff,
        0 0 80px #006cffaa;
}

#menu{
    position:fixed;
    inset:0;
    z-index:90;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    overflow:hidden;
    padding:24px 12px;
    background:
        radial-gradient(ellipse at 15% 15%, #123b5d88 0%, transparent 38%),
        radial-gradient(ellipse at 85% 80%, #4a146688 0%, transparent 42%),
        linear-gradient(145deg, #02050d 0%, #08051b 52%, #02040b 100%);
}
#menu::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.2;
    background-image:linear-gradient(#55eaff20 1px,transparent 1px),linear-gradient(90deg,#55eaff20 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:linear-gradient(to bottom,black,transparent 90%);
}
.menuTitle{
    position:relative;
    color:#f3fcff;
    font-size:clamp(34px,5.5vw,66px);
    font-weight:1000;
    font-style:italic;
    letter-spacing:2px;
    text-align:center;
    line-height:1;
    text-shadow:0 0 10px #00eaff,0 0 35px #0077ff,4px 4px 0 #162b49;
}
.menuEyebrow{position:relative;color:#a9b7d4;font-size:10px;font-weight:900;letter-spacing:clamp(1px,.35vw,5px);text-align:center;margin-bottom:12px}
.menuTitle span{color:#65f4ff;text-shadow:0 0 14px #00d9ff,0 0 38px #006dff}
.menuTagline{position:relative;color:#8399b2;font-size:10px;letter-spacing:2px;text-align:center;margin-top:15px;max-width:90vw}
.menuTitle::after{
    content:"";
    display:block;
    width:72%;
    height:3px;
    margin:12px auto 0;
    border-radius:99px;
    background:linear-gradient(90deg,transparent,#49f5ff,#a86bff,transparent);
    box-shadow:0 0 18px #00d9ff88;
}
.subtitle{
    position:relative;
    color:#9fb9cc;
    margin-top:13px;
    letter-spacing:clamp(2px,.45vw,5px);
    font-size:11px;
    text-align:center;
}
.levels{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:13px;
    margin-top:27px;
    width:min(940px,94vw);
    max-height:58vh;
    overflow:auto;
    padding:8px 10px 14px;
    scrollbar-color:#1fcbe8 #07111d;
    scrollbar-width:thin;
}
.level{
    position:relative;
    min-width:0;
    height:112px;
    overflow:hidden;
    color:white;
    background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--level-color, #35eaff) 20%, transparent), transparent 55%),
        linear-gradient(145deg,#11263aee,#050b14f5 70%);
    border:1px solid #ffffff24;
    border-radius:13px;
    padding:13px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 10px 28px #0009,inset 0 1px 0 #ffffff10;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease;
}
.level::before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:var(--level-color,#35eaff);box-shadow:0 0 15px var(--level-color,#35eaff);opacity:.8}
.level::after{
    content:"";
    position:absolute;
    right:-24px;
    bottom:-36px;
    width:90px;
    height:90px;
    border:1px solid #54eaff35;
    border-radius:50%;
    box-shadow:0 0 0 12px #54eaff08,0 0 0 25px #54eaff05;
    pointer-events:none;
}
.level:hover:not(.locked){
    transform:translateY(-4px) scale(1.015);
    border-color:#55efff;
    box-shadow:0 15px 36px #000b,0 0 22px #00d9ff30;
    filter:brightness(1.12);
}
.level:focus-visible{outline:2px solid #fff;outline-offset:3px}
.level.locked{
    opacity:.42;
    filter:grayscale(.6);
    cursor:not-allowed;
}
.number{
    color:#53eeff;
    font-size:27px;
    font-weight:1000;
    text-shadow:0 0 12px #00d9ff66;
}
.name{
    position:relative;
    z-index:1;
    margin-top:6px;
    color:#d5e5ee;
    font-size:clamp(9px,1vw,11px);
    font-weight:800;
    letter-spacing:.5px;
}
.stars{
    position:relative;
    z-index:1;
    margin-top:8px;
    color:#ffd83d;
    letter-spacing:2px;
    text-shadow:0 0 8px #ffcb2f55;
}
